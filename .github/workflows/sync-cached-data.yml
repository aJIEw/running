name: Sync Cached Data

on:
  workflow_dispatch:
    inputs:
      data_cache_prefix:
        description: 'Data cache prefix'
        required: true
        default: track_data
        type: string
      target_branch:
        description: 'Branch to commit cached data into'
        required: true
        default: master
        type: string
      commit_message:
        description: 'Commit message'
        required: true
        default: sync cached data
        type: string

concurrency:
  group: sync-cached-data-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  sync-cached-data:
    name: Sync cached data
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Validate inputs
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        shell: bash
        run: |
          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$TARGET_BRANCH" == -* ]] || [[ "$TARGET_BRANCH" == *..* ]] || [[ "$TARGET_BRANCH" == *//* ]] || [[ "$TARGET_BRANCH" == */ ]]; then
            echo "Invalid target_branch: $TARGET_BRANCH" >&2
            exit 1
          fi

          if [ -z "$COMMIT_MESSAGE" ]; then
            echo "commit_message must not be empty" >&2
            exit 1
          fi

      - name: Clear data paths before restore
        shell: bash
        run: |
          for dir in activities GPX_OUT TCX_OUT FIT_OUT Workouts; do
            mkdir -p "$dir"
            find "$dir" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          done

          mkdir -p assets run_page src/static
          find assets -maxdepth 1 -type f -name '*.svg' -delete
          rm -f run_page/data.db src/static/activities.json imported.json

      - name: Restore cached data files
        uses: actions/cache/restore@v5
        with:
          path: |
            activities
            assets/*.svg
            GPX_OUT
            TCX_OUT
            FIT_OUT
            Workouts
            run_page/data.db
            src/static/activities.json
            imported.json
          key: manual-sync-cached-data-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.data_cache_prefix }}-
          fail-on-cache-miss: true

      - name: Commit restored data
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- activities GPX_OUT TCX_OUT FIT_OUT Workouts
          git add -A -- 'assets/*.svg' run_page/data.db src/static/activities.json imported.json

          if git diff --cached --quiet; then
            echo "No cached data changes to commit"
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:$TARGET_BRANCH"
